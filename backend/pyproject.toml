[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight — AI-Powered Financial Intelligence Platform (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1",
    "email-validator>=2.3,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
]
# Optional, unofficial Yahoo Finance statements for Indian companies (personal use only per the
# yfinance README). Not installed in CI; tests use fakes.
yfinance = ["yfinance>=1.7,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette deprecation emitted by fastapi.testclient; not actionable from our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "postgres: requires a reachable PostgreSQL instance (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat alembic as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
