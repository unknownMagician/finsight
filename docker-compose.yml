# Local full stack: PostgreSQL + FastAPI + nginx-served frontend.
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
# Frontend: http://localhost:8080   API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      FINSIGHT_ENVIRONMENT: ${FINSIGHT_ENVIRONMENT:-development}
      FINSIGHT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finsight}
      FINSIGHT_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      FINSIGHT_ANTHROPIC_API_KEY: ${FINSIGHT_ANTHROPIC_API_KEY:-}
      FINSIGHT_JWT_SECRET: ${FINSIGHT_JWT_SECRET:-}
      FINSIGHT_SEC_USER_AGENT: ${FINSIGHT_SEC_USER_AGENT:-}
      FINSIGHT_DEFAULT_MARKET: ${FINSIGHT_DEFAULT_MARKET:-IN}
      FINSIGHT_MARKET_DATA_PROVIDER: ${FINSIGHT_MARKET_DATA_PROVIDER:-demo}
      FINSIGHT_FUNDAMENTALS_PROVIDER: ${FINSIGHT_FUNDAMENTALS_PROVIDER:-demo}
      # Which peers may set X-Forwarded-For (used for per-IP rate limits). "*" is acceptable
      # here only because port 8000 is bound to 127.0.0.1; restrict it in production.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
